name: Build ORCA Modular Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK NDK and CMake
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - name: Verify 40 Orca programs and bundled DSP source
        run: python3 scripts/verify-kit.py
      - name: Fetch original Orca JavaScript app and apply Android integration
        run: bash scripts/fetch-orca.sh
      - name: Verify bundled official Mutable Instruments DSP
        run: |
          test -s app/src/main/cpp/eurorack/plaits/dsp/voice.cc
          test -s app/src/main/cpp/eurorack/rings/dsp/part.cc
          test -s app/src/main/cpp/eurorack/beads/dsp/processor.cc
      - name: Check bridge JavaScript syntax
        run: node --check app/src/main/assets/orca/android-bridge.js
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ORCA-Modular-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
